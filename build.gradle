plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

group = 'it.buzz.template'
version = '1.0'

def versions = [
        paperApi      : '1.20.4-R0.1-SNAPSHOT',
        configme      : '1.4.1',
        hikariCP      : '5.1.0',
        mariaDB       : '3.2.0',
        loadit        : '1.2.2-SNAPSHOT',
        lamp          : '4.0.0-beta.19',
        lombok        : '1.18.30',
        javaTarget    : 21
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(versions.javaTarget)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'papermc-repo'
        url  = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${versions.paperApi}"
    compileOnly "ch.jalu:configme:${versions.configme}"
    compileOnly("com.zaxxer:HikariCP:${versions.hikariCP}") {
        exclude group: 'org.slf4j'
    }
    compileOnly("org.mariadb.jdbc:mariadb-java-client:${versions.mariaDB}") {
        exclude group: 'org.slf4j'
    }

    implementation "it.ytnoos.loadit:loadit:${versions.loadit}"
    implementation "io.github.revxrsal:lamp.common:${versions.lamp}"
    implementation "io.github.revxrsal:lamp.bukkit:${versions.lamp}"
    implementation "io.github.revxrsal:lamp.brigadier:${versions.lamp}"

    compileOnly   "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
    options.release.set(versions.javaTarget)
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property('version', version)
    filesMatching('plugin.yml') {
        expand(version: version)
    }
}

shadowJar {
    archiveBaseName.set(project.name)
    archiveVersion.set(project.version.toString())
    // sposta solo le classi di terze parti nei packages dedicati
    relocate 'it.ytnoos.loadit', 'it.buzz.template.libraries.loadit'
    relocate 'revxrsal.commands',  'it.buzz.template.libraries.lamp'
}
