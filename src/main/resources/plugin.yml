name: ${name}
version: "${version}"
main: ${main}
description: "${description}"
api-version: "${apiVersion}"
authors: ${authors}
# Downloaded by Paper at startup (kept out of the jar). Generated from gradle/libs.versions.toml.
libraries:
${libraries}

permissions:
  template.admin:
    description: Access to /template
    default: op
    children:
      template.admin.reload: true
      template.admin.stats: true
  template.admin.reload:
    default: op
  template.admin.stats:
    default: op
